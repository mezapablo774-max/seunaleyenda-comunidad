name: Validar manifiesto y packs

on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'packs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar manifest.json y packs
        run: node scripts/validate-manifest.js
